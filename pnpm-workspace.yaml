packages:
  - "."

# Local CopilotKit checkout (no verdaccio needed).
# - runtime is symlinked: it runs under Node (tsx), where resolving its deps
#   from ../CopilotKit/node_modules is correct, and rebuilds are picked up live.
# - browser-side packages are consumed as packed tarballs so their @angular/*
#   peers resolve to THIS app's Angular 22 (a symlink would pull CopilotKit's
#   own Angular copy into the bundle and break signal/DI identity).
# Refresh after changing CopilotKit:
#   cd ../CopilotKit && pnpm exec nx run-many -t build -p @copilotkit/angular @copilotkit/runtime
#   for p in angular a2ui-renderer core shared web-components; do
#     (cd packages/$p && pnpm pack --pack-destination ../../../angular-a2ui-macroquest/.copilotkit-local/)
#   done
#   cd ../angular-a2ui-macroquest && pnpm install
overrides:
  "@copilotkit/angular": "file:.copilotkit-local/copilotkit-angular-0.1.1.tgz"
  "@copilotkit/a2ui-renderer": "file:.copilotkit-local/copilotkit-a2ui-renderer-1.62.3.tgz"
  "@copilotkit/core": "file:.copilotkit-local/copilotkit-core-1.62.3.tgz"
  "@copilotkit/shared": "file:.copilotkit-local/copilotkit-shared-1.62.3.tgz"
  "@copilotkit/web-components": "file:.copilotkit-local/copilotkit-web-components-1.62.3.tgz"
  "@copilotkit/runtime": "link:../CopilotKit/packages/runtime"

# @copilotkit/angular@0.1.x declares Angular peers of ^19||^20||^21, but this
# app runs Angular 22 (API-compatible for what the library uses). Allow it.
peerDependencyRules:
  allowedVersions:
    "@copilotkit/angular>@angular/core": "22"
    "@copilotkit/angular>@angular/common": "22"
    "@copilotkit/angular>@angular/cdk": "22"
