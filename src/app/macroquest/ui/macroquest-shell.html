<main class="macro-shell min-h-dvh bg-base-200 text-base-content">
  <div
    class="mx-auto flex w-full max-w-6xl flex-col gap-6 px-5 py-8 sm:px-8 sm:py-10 xl:h-dvh xl:w-max xl:max-w-full xl:flex-row xl:items-stretch xl:overflow-hidden"
  >
    <section
      class="flex w-full min-w-0 max-w-6xl flex-col gap-8 xl:w-[72rem] xl:shrink xl:overflow-y-auto"
      aria-label="MacroQuest dashboard"
    >
      <mq-dashboard
        [goals]="store.goals()"
        [totals]="store.dailyTotals()"
        [remaining]="store.remaining()"
        [questProgress]="store.questProgress()"
        [macroScore]="store.macroScore()"
        [meals]="store.activeMeals()"
        [selectedMealId]="store.selectedMealId()"
        [dayLabel]="store.dayLabel()"
        (resetDemo)="store.resetDemo()"
        (mealSelected)="store.selectMeal($event)"
      />

      <mq-recommended-meals />

      @if (surfaces().length) {
        <section
          class="rounded-2xl border border-base-300/70 bg-base-100 p-6"
          aria-label="Generated interface"
        >
          @for (surface of surfaces(); track surface.id) {
            <copilot-a2ui-activity-renderer
              [activityType]="surface.activityType"
              [content]="surface.content"
              [message]="surface"
              [agent]="agentStore().agent"
            />
          }
        </section>
      }

      <mq-meal-timeline
        [meals]="store.activeMeals()"
        [dayLabel]="store.dayLabel()"
        [canGoNextDay]="store.canGoNextDay()"
        (mealSelected)="store.selectMeal($event)"
        (servingsChanged)="store.updateServings($event)"
        (titleChanged)="store.renameMeal($event.mealId, $event.title)"
        (itemEdited)="store.updateFoodItem($event)"
        (mealConfirmed)="store.confirmMeal($event)"
        (previousDay)="store.showPreviousDay()"
        (nextDay)="store.showNextDay()"
      />
    </section>

    <aside
      class="copilot-panel flex min-h-150 w-full shrink-0 flex-col overflow-hidden rounded-2xl border border-base-300/70 bg-base-100 shadow-xl xl:h-full xl:w-[30rem]"
      aria-label="MacroQuest copilot"
    >
      <mq-demo-meal-plates [chat]="chat()" />

      <div class="min-h-0 flex-1 bg-base-100 p-3">
        <copilot-chat [attachments]="store.mealPhotoAttachments" />
      </div>
    </aside>
  </div>
</main>
