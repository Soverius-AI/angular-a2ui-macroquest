<section class="card mq-card">
  <div class="card-body gap-3 p-6">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-bold uppercase tracking-wide text-base-content/60">
          {{ dayLabel() }}
        </p>
        <h2 class="text-2xl font-black">Meal log</h2>
      </div>
      <div class="flex gap-2">
        <button
          type="button"
          class="btn btn-circle btn-sm btn-ghost border border-base-300"
          aria-label="Previous day"
          (click)="previousDay.emit()"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button
          type="button"
          class="btn btn-circle btn-sm btn-ghost border border-base-300"
          aria-label="Next day"
          [disabled]="!canGoNextDay()"
          (click)="nextDay.emit()"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>

    @for (meal of meals(); track meal.id) {
      <article
        class="overflow-hidden rounded-2xl border bg-base-100 transition"
        [class.border-base-300]="expandedMealId() !== meal.id"
        [class.border-primary/40]="expandedMealId() === meal.id"
        [class.shadow-md]="expandedMealId() === meal.id"
      >
        <button
          type="button"
          class="flex w-full cursor-pointer items-center gap-4 px-5 py-4 text-left hover:bg-base-200/60"
          [attr.aria-expanded]="expandedMealId() === meal.id"
          [attr.aria-controls]="'meal-form-' + meal.id"
          (click)="toggleMeal(meal.id)"
        >
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-2">
              <span class="text-lg font-bold tracking-tight">{{ meal.title }}</span>
              @if (meal.status === 'draft') {
                <span class="badge badge-warning badge-outline badge-sm font-semibold">
                  Draft · not counted yet
                </span>
              }
            </span>
            @if (mealTotals(meal); as totals) {
              <span class="mt-1 block truncate">
                <span class="text-base font-black">{{ totals.calories }} kcal</span>
                <span class="text-sm font-normal text-base-content/60">
                  · {{ totals.protein }}g protein · {{ totals.carbs }}g carbs · {{ totals.fat }}g
                  fat
                </span>
              </span>
            }
          </span>
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-base-300 text-base-content/70 transition"
            [class.border-primary/40]="expandedMealId() === meal.id"
            [class.bg-primary/10]="expandedMealId() === meal.id"
            [class.text-primary]="expandedMealId() === meal.id"
            aria-hidden="true"
          >
            <svg
              class="h-4 w-4 transition"
              [class.rotate-180]="expandedMealId() === meal.id"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </span>
        </button>

        @if (expandedMealId() === meal.id) {
          <div [id]="'meal-form-' + meal.id" class="border-t border-primary/15 bg-base-200/40">
            <mq-meal-workbench
              [meal]="meal"
              [totals]="mealTotals(meal)"
              (servingsChanged)="servingsChanged.emit($event)"
              (titleChanged)="titleChanged.emit($event)"
              (itemEdited)="itemEdited.emit($event)"
            />
            @if (meal.status === 'draft') {
              <div
                class="flex flex-wrap items-center justify-between gap-3 border-t border-base-300 px-6 py-4"
              >
                <p class="text-sm text-base-content/70">
                  An estimate. Confirm it to count it toward today.
                </p>
                <button
                  type="button"
                  class="btn btn-primary rounded-full"
                  (click)="mealConfirmed.emit(meal.id)"
                >
                  Confirm meal
                </button>
              </div>
            }
          </div>
        }
      </article>
    } @empty {
      <p class="text-base-content/60">No meals logged for this quest yet.</p>
    }
  </div>
</section>
